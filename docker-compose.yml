services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-user_management_api_development}
      MYSQL_USER: ${DB_USER:-rails}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rails_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      target: development
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      BUNDLE_WITHOUT: ""
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-user_management_api_development}
      DB_USER: ${DB_USER:-rails}
      DB_PASSWORD: ${DB_PASSWORD:-rails_password}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_jwt_secret_change_me}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0"

volumes:
  mysql_data:
  bundle: