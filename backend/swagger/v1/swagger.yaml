openapi: 3.0.1
info:
  title: User Management API
  version: '1.0'
servers:
  - url: http://localhost:3000
paths:
  /api/v1/auth/register:
    post:
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    name: { type: string }
                    email: { type: string }
                    password: { type: string }
                    password_confirmation: { type: string }
      responses:
        '201': { description: created }
        '422': { description: unprocessable }
  /api/v1/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: ok }
        '401': { description: unauthorized }
  /api/v1/auth/refresh:
    post:
      summary: Refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        '200': { description: ok }
        '401': { description: unauthorized }
  /api/v1/auth/logout:
    delete:
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        '200': { description: ok }
  /api/v1/auth/me:
    get:
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        '200': { description: ok }
        '401': { description: unauthorized }
  /api/v1/users:
    get:
      summary: List users
      security:
        - bearerAuth: []
      responses:
        '200': { description: ok }
        '401': { description: unauthorized }
  /api/v1/users/{id}:
    get:
      summary: Show user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      security:
        - bearerAuth: []
      responses:
        '200': { description: ok }
        '404': { description: not found }
    patch:
      summary: Update user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    name: { type: string }
                    email: { type: string }
                    role: { type: string }
      responses:
        '200': { description: ok }
        '422': { description: unprocessable }
    delete:
      summary: Delete user
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      security:
        - bearerAuth: []
      responses:
        '200': { description: ok }
        '404': { description: not found }
  /api/v1/job_categories:
    get:
      summary: List job categories
      responses:
        '200': { description: ok }
    post:
      summary: Create job category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                job_category:
                  type: object
                  properties:
                    name: { type: string }
      responses:
        '201': { description: created }
  /api/v1/job_categories/{id}:
    get:
      summary: Show job category
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: ok }
    patch:
      summary: Update job category
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                job_category:
                  type: object
                  properties:
                    name: { type: string }
      responses:
        '200': { description: ok }
    delete:
      summary: Delete job category
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: no content }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
